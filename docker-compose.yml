version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: event_manager_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: events_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # We now use the npm run migrate script to manage schemas
      # - ./backend/src/config/schema.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: event_manager_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
