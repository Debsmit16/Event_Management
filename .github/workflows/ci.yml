name: Enterprise CI/CD

on:
  push:
    branches: [ "prod", "staging", "dev" ]
  pull_request:
    branches: [ "prod", "staging", "dev" ]

jobs:
  backend-test:
    name: Backend CI
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_events_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./backend
      run: npm ci || npm install
      
    - name: Run Build (Type Check)
      working-directory: ./backend
      run: npm run build
      
    - name: Run Migrations
      working-directory: ./backend
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_events_db
        REDIS_URL: redis://localhost:6379
      run: npm run migrate

      
    - name: Run Tests
      working-directory: ./backend
      env:
        DB_HOST: localhost
        DB_PORT: 5432
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_NAME: test_events_db
        JWT_SECRET: test_secret_key_that_is_at_least_32_chars_long
        REDIS_URL: redis://localhost:6379
      run: npm run test --if-present

  frontend-build:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci || npm install
      
    - name: Build Next.js App
      working-directory: ./frontend
      env:
        NEXT_PUBLIC_API_URL: /api/v1
      run: npm run build

  deploy-production:
    name: Continuous Deployment (CD)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/prod'

    steps:
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/app
          sudo -u ubuntu git fetch origin prod
          sudo -u ubuntu git reset --hard origin/prod
          sudo -u ubuntu docker-compose rm -f -s -v frontend backend
          sudo -u ubuntu docker-compose up --build -d
